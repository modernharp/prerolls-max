# Builds the multi-arch Docker image (linux/amd64 + linux/arm64).
#
# - Push to the default branch: pushes ghcr.io/<owner>/prerolls-max:edge
# - Called by release.yml for a v* tag: pushes X.Y.Z, and for a stable release
#   also X.Y, X and latest (pre-releases such as 1.0.0-beta.1 never move them)
# - Any other branch, or run by hand without "push": builds both platforms only
#
# Docker Hub as well, only when the repository has the secrets
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (image <username>/prerolls-max).
name: Docker

on:
  push:
    branches-ignore: [gh-pages]
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - docker-entrypoint.sh
      - requirements.txt
      - app/**
      - frontend/**
      - plugins/**
      - assets/**
      - scripts/write_build_info.py
      - .github/workflows/docker.yml
  workflow_dispatch:
    inputs:
      push:
        description: Push the image (edge on the default branch)
        type: boolean
        default: false
  workflow_call:
    inputs:
      push:
        description: Push the image
        type: boolean
        default: true
    outputs:
      image:
        description: The GHCR image name
        value: ${{ jobs.image.outputs.image }}
      digest:
        description: The pushed manifest digest
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  image:
    name: Build ${{ (inputs.push || github.ref_name == github.event.repository.default_branch) && 'and push ' || '' }}image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write       # push to GHCR (only used when pushing)
    outputs:
      image: ${{ steps.names.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Names and version
        id: names
        env:
          OWNER: ${{ github.repository_owner }}
          PUSH_INPUT: ${{ inputs.push }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/prerolls-max" >> "$GITHUB_OUTPUT"
          version="$(python3 -c "import re;print(re.search(r\"__version__\s*=\s*'([^']+)'\", open('app/version.py',encoding='utf-8-sig').read()).group(1))")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          push=false
          if [ "$PUSH_INPUT" = "true" ]; then push=true; fi
          if [ "$EVENT" = "push" ] && [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then push=true; fi
          echo "push=$push" >> "$GITHUB_OUTPUT"
          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            echo "dockerhub=${DOCKERHUB_USERNAME}/prerolls-max" >> "$GITHUB_OUTPUT"
          fi
          echo "Image ghcr.io/${owner}/prerolls-max, version $version, push=$push"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: steps.names.outputs.push == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: steps.names.outputs.push == 'true' && steps.names.outputs.dockerhub != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ steps.names.outputs.image }}
            ${{ steps.names.outputs.dockerhub }}
          flavor: |
            latest=auto
          tags: |
            type=edge,branch=${{ github.event.repository.default_branch }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch,enable=${{ steps.names.outputs.push != 'true' }}
          labels: |
            org.opencontainers.image.title=Prerolls Max
            org.opencontainers.image.description=Intro videos (prerolls) for Plex, Jellyfin and Emby. Replaces NeXroll.
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0

      - name: Build${{ steps.names.outputs.push == 'true' && ' and push' || '' }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.names.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.names.outputs.version }}
            PMAX_REPOSITORY=${{ github.repository }}
            PMAX_COMMIT=${{ github.sha }}
            PMAX_IMAGE=${{ steps.names.outputs.image }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=docker-multi
          cache-to: type=gha,scope=docker-multi,mode=max

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          PUSHED: ${{ steps.names.outputs.push }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Docker image"
            echo "Pushed: $PUSHED  "
            echo "Digest: \`$DIGEST\`"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
