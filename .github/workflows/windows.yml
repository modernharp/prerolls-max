# Builds the Windows installer PrerollsMax_Installer_v<version>.exe on a
# Windows runner (web interface, PyInstaller programs, plugins, NSIS), then
# installs it silently on the runner, checks /health on 9393 and next to
# NeXroll on 9494, and uninstalls. Uploads the "windows-installer" artifact.
name: Windows

on:
  push:
    branches-ignore: [gh-pages]
    paths:
      - app/**
      - frontend/**
      - plugins/**
      - packaging/windows/**
      - assets/**
      - requirements.txt
      - scripts/write_build_info.py
      - .github/workflows/windows.yml
  workflow_dispatch:
  workflow_call:
    outputs:
      installer:
        description: The installer's file name
        value: ${{ jobs.installer.outputs.installer }}

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  plugins:
    name: Plugins
    uses: ./.github/workflows/plugins.yml

  installer:
    name: Build and smoke-test the installer
    needs: plugins
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      installer: ${{ steps.build.outputs.installer }}
    env:
      # Release and default-branch builds name this repository as their update
      # source (build_info.json). Other branches are test builds: "none", updates off.
      PMAX_BUILD_REPOSITORY: ${{ (startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch) && github.repository || 'none' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/windows/requirements-build.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Plugins from the plugins job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugins
          path: plugins/out
      - name: Python packages
        run: python -m pip install -r requirements.txt -r packaging/windows/requirements-build.txt
      - name: NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }
      - name: Build
        id: build
        shell: pwsh
        run: |
          ./packaging/windows/build.ps1
          $installer = Get-ChildItem packaging/windows/dist -Filter 'PrerollsMax_Installer_v*.exe' | Select-Object -First 1
          "installer=$($installer.Name)" >> $env:GITHUB_OUTPUT
          Get-ChildItem packaging/windows/dist | Format-Table Name, Length | Out-String | Write-Host
      - name: Smoke test (install, /health, uninstall)
        shell: pwsh
        run: ./packaging/windows/smoke-test.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: |
            packaging/windows/dist/PrerollsMax_Installer_v*.exe
            packaging/windows/dist/PrerollsMax_Installer_v*.exe.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Logs
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "$env:ProgramData\Prerolls Max\logs" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "--- $($_.FullName)"; Get-Content $_.FullName -Tail 200
          }
