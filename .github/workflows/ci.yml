# Checks every push and pull request: versions agree, workflow files lint,
# backend tests, the web interface (types, tests, build), the plugins, and a
# Docker image that builds and answers /health (not pushed).
name: CI

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Versions and workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versions agree
        run: python3 scripts/bump_version.py --check
      - name: Lint workflow files (actionlint)
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "$url" -o actionlint.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        working-directory: app
        run: python -m pytest tests -q -p no:cacheprovider

  frontend:
    name: Web interface
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build

  plugins:
    name: Plugins
    uses: ./.github/workflows/plugins.yml

  docker:
    name: Docker image (build and run, not pushed)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: prerollsmax:ci
          build-args: |
            PMAX_REPOSITORY=${{ github.repository }}
            PMAX_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=docker-amd64
          cache-to: type=gha,scope=docker-amd64,mode=max
      - name: Run it and check /health, the plugins and the user it runs as
        run: |
          set -euo pipefail
          docker run -d --name pmax -p 9393:9393 prerollsmax:ci
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9393/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:9393/health
          curl -fsS -o /dev/null -w "web page: %{http_code}\n" http://127.0.0.1:9393/
          docker exec pmax cat /app/server/build_info.json
          user="$(docker exec pmax sh -c 'ps -o user= -p 1 2>/dev/null || stat -c %U /proc/1')"
          echo "PID 1 runs as: $user"
          test "$(docker exec pmax sh -c 'stat -c %u /proc/1')" = "1000"
          docker exec pmax ls -l /app/plugins
      - name: Container log
        if: always()
        run: docker logs pmax || true
