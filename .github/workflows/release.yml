# Cuts a release when a version tag is pushed:
#   python scripts/bump_version.py 1.2.3   (commit, push)
#   git tag v1.2.3 && git push origin v1.2.3
#
# 1. checks the tag matches app/version.py and runs the backend tests
# 2. builds and smoke-tests the Windows installer and the plugins (windows.yml)
# 3. builds and pushes the Docker image to GHCR (docker.yml): X.Y.Z, and for a
#    stable release X.Y, X and latest
# 4. creates the GitHub release: installer, plugin zips, Unraid template,
#    source zip, SHA256SUMS.txt, notes from app/CHANGELOG.md. A version with a
#    "-" (1.0.0-beta.1) is marked as a pre-release.
# 5. updates the gh-pages branch: the Jellyfin plugin catalogs
#    (jellyfin/manifest.json for 12, jellyfin/manifest-10.11.json), the Unraid
#    template and a front page.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Tag, version and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches the version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/bump_version.py --check --tag "$TAG"
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Backend tests
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          pip install -r requirements.txt pytest
          cd app && python -m pytest tests -q -p no:cacheprovider

  windows:
    name: Windows installer and plugins
    needs: check
    uses: ./.github/workflows/windows.yml

  docker:
    name: Docker image
    needs: check
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
    with:
      push: true
    secrets: inherit

  release:
    name: GitHub release
    needs: [check, windows, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugins
          path: dist
      - name: Source zip, Unraid template, checksums, notes
        run: |
          set -euo pipefail
          git archive --format=zip --prefix="prerolls-max-${VERSION}/" -o "dist/prerolls-max-${VERSION}-source.zip" HEAD
          python3 scripts/render_templates.py --repository "$GITHUB_REPOSITORY" --out rendered
          cp rendered/unraid/prerolls-max.xml dist/prerolls-max.xml
          # The bare Emby DLL and the per-file .sha256 are covered by the zip and SHA256SUMS.txt
          rm -f dist/PrerollsMax.Emby.dll dist/*.sha256
          (cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          python3 scripts/release_notes.py "$VERSION" --repository "$GITHUB_REPOSITORY" > notes.md
          test -f "dist/PrerollsMax_Installer_v${VERSION}.exe"
      - name: Create the release
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" dist/* --verify-tag --title "Prerolls Max ${VERSION}" --notes-file notes.md "${flags[@]}"
          {
            echo "### Release ${VERSION}"
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"

  pages:
    name: Jellyfin catalog and Unraid template (gh-pages)
    needs: [check, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # push gh-pages, upload the catalog zips to the release
      pages: write      # switch Pages on for gh-pages the first time
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Check out gh-pages (created on the first release)
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth 1 origin gh-pages
            git worktree add site FETCH_HEAD
            git -C site switch -c gh-pages
          else
            git worktree add --orphan -b gh-pages site
          fi
      - name: Update the Jellyfin catalogs and templates
        run: |
          set -euo pipefail
          python3 plugins/jellyfin-repo/update_repository.py --repository "$GITHUB_REPOSITORY" --tag "$TAG" --output site/jellyfin
          python3 scripts/render_templates.py --repository "$GITHUB_REPOSITORY" --out site
          find site -path site/.git -prune -o -type f -print | head -40
      - name: Publish gh-pages
        run: |
          set -euo pipefail
          cd site
          git add -A
          if git diff --cached --quiet; then echo "gh-pages already up to date"; exit 0; fi
          git commit -m "Catalogs and templates for ${TAG}"
          git push origin HEAD:gh-pages
      - name: Switch on GitHub Pages for gh-pages (first release)
        continue-on-error: true
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "Pages is on: $(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .html_url)"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" \
              || echo "::warning::Could not switch on GitHub Pages. Do it in Settings > Pages: Deploy from a branch, gh-pages, / (root)."
          fi
